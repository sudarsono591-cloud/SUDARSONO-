
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scanner Absensi SDN Canggu</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    .container {
      max-width: 520px;
      margin: auto;
      padding: 22px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 5px 25px #0001;
    }

    h2 { text-align: center; color: #1d4ed8; }
    p { text-align: center; color: #64748b; }

    #reader {
      width: 100%;
      margin: 20px auto;
    }

    button, select {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border: 0;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button.stop { background: #dc2626; }
    button:disabled { opacity: .5; }

    #hasil {
      padding: 15px;
      margin-top: 15px;
      border-radius: 10px;
      background: #f1f5f9;
      overflow-wrap: anywhere;
    }

    .sukses { background: #dcfce7 !important; color: #166534; }
    .gagal { background: #fee2e2 !important; color: #991b1b; }

    small { color: #64748b; }
  </style>
</head>

<body>
<div class="container">
  <h2>ABSENSI SISWA</h2>
  <p>SDN CANGGU · Pemindai QR Code</p>

  <label for="peran">Login sebagai:</label>
  <select id="peran">
    <option value="guru">Guru</option>
    <option value="admin">Admin</option>
  </select>

  <label for="kelas">Kelas guru:</label>
  <select id="kelas">
    <option value="III B">III B</option>
    <option value="III A">III A</option>
    <option value="III C">III C</option>
  </select>

  <div id="reader"></div>

  <button id="mulai" onclick="mulaiScanner()">Buka Kamera</button>
  <button class="stop" onclick="berhentiScanner()">Tutup Kamera</button>

  <div id="hasil">Kamera belum dijalankan.</div>

  <p><small>
    Izinkan akses kamera ketika diminta. Gunakan QR Code yang berisi NISN siswa.
  </small></p>
</div>

<script>
  // URL aplikasi Google Apps Script milik Bapak
  const API_URL =
    "https://script.google.com/macros/s/AKfycbyq1Q6kcLLcKmm_ZvozYpyLSEJQ83P7SVLjzDapy4l1HnLxslwfxJo2hksjYlPyr_Axzw/exec";

  let scanner = null;
  let sedangProses = false;
  let scanTerakhir = "";

  function tampilkan(pesan, jenis = "") {
    const el = document.getElementById("hasil");
    el.className = jenis;
    el.textContent = pesan;
  }

  async function mulaiScanner() {
    try {
      if (scanner) {
        await berhentiScanner();
      }

      scanner = new Html5Qrcode("reader");
      tampilkan("Meminta akses kamera...");

      await scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        hasilScan,
        () => {}
      );

      tampilkan("Kamera aktif. Arahkan ke QR Code siswa.");
      document.getElementById("mulai").disabled = true;

    } catch (e) {
      tampilkan(
        "Kamera gagal dibuka. Pastikan izin kamera aktif dan halaman menggunakan HTTPS. " + e,
        "gagal"
      );
    }
  }

  async function berhentiScanner() {
    if (scanner) {
      try {
        if (scanner.isScanning) {
          await scanner.stop();
        }
        await scanner.clear();
      } catch (e) {
        console.log(e);
      }
      scanner = null;
    }

    document.getElementById("mulai").disabled = false;
    tampilkan("Kamera ditutup.");
  }

  async function hasilScan(teks) {
    if (sedangProses || teks === scanTerakhir) return;

    sedangProses = true;
    scanTerakhir = teks;

    // QR boleh berisi NISN langsung atau URL yang memiliki parameter nisn.
    let nisn = teks.trim();

    try {
      if (/^https?:\/\//i.test(nisn)) {
        const url = new URL(nisn);
        nisn = url.searchParams.get("nisn") || nisn;
      }
    } catch (e) {}

    // Pastikan QR berisi NISN, bukan sembarang teks.
    if (!/^\d{10}$/.test(nisn)) {
      tampilkan(
        "QR terbaca, tetapi isinya bukan NISN 10 digit: " + teks,
        "gagal"
      );
      sedangProses = false;
      setTimeout(() => scanTerakhir = "", 2000);
      return;
    }

    tampilkan("Mengirim NISN " + nisn + " ke server...");

    try {
      const params = new URLSearchParams({
        action: "scanAbsensi",
        nisn: nisn,
        role: document.getElementById("peran").value,
        kelas: document.getElementById("kelas").value
      });

      const response = await fetch(API_URL + "?" + params.toString());
      const data = await response.json();

      if (data.success) {
        tampilkan(
          "BERHASIL\n" +
          (data.nama || "") + "\n" +
          "Kelas: " + (data.kelas || "-") + "\n" +
          data.message,
          "sukses"
        );
      } else {
        tampilkan("ABSENSI GAGAL\n" + data.message, "gagal");
      }

    } catch (e) {
      tampilkan(
        "Hasil scan terbaca, tetapi koneksi ke server gagal. " +
        "Endpoint perlu dihubungkan terlebih dahulu.",
        "gagal"
      );
    }

    setTimeout(() => {
      sedangProses = false;
      scanTerakhir = "";
    }, 2500);
  }
</script>
</body>
</html>
